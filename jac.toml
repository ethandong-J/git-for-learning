[project]
name = "git-for-learning"
version = "0.1.0"
description = "Branch — a tree-structured tutoring app built in Jac"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

# byLLM capability. Presence of this section makes `jac install` pull litellm
# into .jac/venv so real providers work. The actual model is chosen at runtime
# from the GFL_MODEL env var (see study.jac); litellm reads the provider key
# (ANTHROPIC_API_KEY / OPENAI_API_KEY) straight from the environment.
[byllm.model]
default_model = "gpt-4o-mini"

[dependencies]
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[serve]
base_route_app = "app"
port = 8000

[client]
